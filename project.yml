name: SleepBank
options:
  bundleIdPrefix: com.doctordurant.sleepbank
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  SleepChartKit:
    path: .
  PolarBleSdk:
    path: ../polar-ble-sdk-patched

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ADVQS8RXPZ
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  # ---------------------------------------------------------------- iOS app
  SleepBank:
    type: application
    platform: iOS
    sources:
      - App/iOS
      - App/Shared
    dependencies:
      - package: SleepChartKit
        product: SleepChartKit
      - package: SleepChartKit
        product: SleepBankCore
      - package: PolarBleSdk
        product: PolarBleSdk
      - target: SleepBankWatch
        embed: true
    info:
      path: App/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthShareUsageDescription: "SleepBank reads your sleep and heart-rate data to study your naps and validate nap-onset detection."
        NSHealthUpdateUsageDescription: "SleepBank records your naps to Apple Health."
        NSBluetoothAlwaysUsageDescription: "SleepBank connects to a Muse headband and Polar H10 to read EEG and continuous heart rate for sleep-onset detection."
        # Keep H10/Muse streaming and relaxing-sound playback alive while the
        # phone is backgrounded/locked during a nap.
        UIBackgroundModes:
          - bluetooth-central
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.sleepbank
    entitlements:
      path: App/iOS/SleepBank.entitlements
      properties:
        com.apple.developer.healthkit: true

  # -------------------------------------------------------------- watch app
  SleepBankWatch:
    type: application
    platform: watchOS
    sources:
      - App/Watch
      - App/Shared
    dependencies:
      - package: SleepChartKit
        product: SleepBankCore
      - package: SleepChartKit
        product: SleepChartKit
    info:
      path: App/Watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.doctordurant.sleepbank
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "SleepBank reads your heart rate during a nap to detect sleep onset."
        NSHealthUpdateUsageDescription: "SleepBank records your naps to Apple Health."
        NSMotionUsageDescription: "SleepBank uses motion to detect when you have settled and fallen asleep."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.sleepbank.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: SleepBank
    entitlements:
      path: App/Watch/SleepBankWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

schemes:
  SleepBank:
    build:
      targets:
        SleepBank: all
    run:
      config: Debug
  SleepBankWatch:
    build:
      targets:
        SleepBankWatch: all
    run:
      config: Debug
