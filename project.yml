name: SleepBank
options:
  bundleIdPrefix: com.doctordurant.sleepbank
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  SleepChartKit:
    path: .
  PolarBleSdk:
    path: ../polar-ble-sdk-patched

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ADVQS8RXPZ
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  # ---------------------------------------------------------------- iOS app
  SleepBank:
    type: application
    platform: iOS
    sources:
      - App/iOS
      - App/Shared
    dependencies:
      - package: SleepChartKit
        product: SleepChartKit
      - package: SleepChartKit
        product: SleepBankCore
      - package: PolarBleSdk
        product: PolarBleSdk
      - target: SleepBankWatch
        embed: true
      - target: SleepBankWidget
        embed: true
      - target: SleepBankDeviceMonitor
        embed: true
    info:
      path: App/iOS/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "SleepBank reads your sleep and heart-rate data to study your naps and validate nap-onset detection."
        NSHealthUpdateUsageDescription: "SleepBank records your naps to Apple Health."
        NSHomeKitUsageDescription: "SleepBank warms your HomeKit lights at wind-down to help you sleep."
        NSCalendarsFullAccessUsageDescription: "SleepBank checks your calendar for busy times so it suggests a nap when you're actually free."
        NSLocationWhenInUseUsageDescription: "SleepBank uses your approximate location only to know your local sunrise and sunset, so it can tell daylight from after-dark when timing your light and activity advice."
        NSBluetoothAlwaysUsageDescription: "SleepBank connects to a Muse headband and Polar H10 to read EEG and continuous heart rate for sleep-onset detection."
        # Keep H10/Muse streaming and relaxing-sound playback alive while the
        # phone is backgrounded/locked during a nap.
        UIBackgroundModes:
          - bluetooth-central
          - audio
        # Make the iCloud Documents container visible in Files / Mac Finder so
        # exported nap EEG syncs to the Mac automatically.
        NSUbiquitousContainers:
          iCloud.com.doctordurant.sleepbank:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: SleepBank
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.sleepbank
    entitlements:
      path: App/iOS/SleepBank.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Wind-Down Mode app shielding. Auto-provisions for DEVELOPMENT builds (no
        # approval needed); a TestFlight/App Store build needs Apple's gated
        # Family Controls (Distribution) request first. See docs/WIND_DOWN_MODE.md.
        com.apple.developer.family-controls: true
        # Circadian home lighting — set HomeKit bulb color temperature on the user's
        # rhythm (warm at wind-down). Ungated capability.
        com.apple.developer.homekit: true
        com.apple.security.application-groups:
          - group.com.doctordurant.sleepbank
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.doctordurant.sleepbank
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.doctordurant.sleepbank

  # -------------------------------------------------------------- watch app
  SleepBankWatch:
    type: application
    platform: watchOS
    sources:
      - App/Watch
      - App/Shared
    dependencies:
      - package: SleepChartKit
        product: SleepBankCore
      - package: SleepChartKit
        product: SleepChartKit
      - target: SleepBankWatchWidget
        embed: true
    info:
      path: App/Watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.doctordurant.sleepbank
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "SleepBank reads your heart rate during a nap to detect sleep onset."
        NSHealthUpdateUsageDescription: "SleepBank records your naps to Apple Health."
        NSMotionUsageDescription: "SleepBank uses motion to detect when you have settled and fallen asleep."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.sleepbank.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: SleepBank
    entitlements:
      path: App/Watch/SleepBankWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.doctordurant.sleepbank

  # ------------------------------------------ watch complication widget extension
  SleepBankWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - App/WatchWidget
      - path: App/Shared/SharedStore.swift
        buildPhase: sources
      - path: App/Shared/PlanSummary.swift
        buildPhase: sources
    info:
      path: App/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: SleepBank
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.sleepbank.watchkitapp.widget
    entitlements:
      path: App/WatchWidget/SleepBankWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doctordurant.sleepbank

  # ----------------------------------------------------- widget extension (iOS)
  SleepBankWidget:
    type: app-extension
    platform: iOS
    sources:
      - App/Widget
      - path: App/Shared/NapActivityAttributes.swift
        buildPhase: sources
      - path: App/Shared/SharedStore.swift
        buildPhase: sources
      - path: App/Shared/RhythmSnapshot.swift
        buildPhase: sources
    dependencies:
      - package: SleepChartKit
        product: SleepBankCore
    info:
      path: App/Widget/Info.plist
      properties:
        CFBundleDisplayName: SleepBank
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.sleepbank.widget
    entitlements:
      path: App/Widget/SleepBankWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.doctordurant.sleepbank

  # ----------------------------------- DeviceActivityMonitor extension (Wind-Down)
  SleepBankDeviceMonitor:
    type: app-extension
    platform: iOS
    sources:
      - App/DeviceMonitor
      - path: App/Shared/WindDownShield.swift
        buildPhase: sources
    info:
      path: App/DeviceMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).WindDownMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.sleepbank.devicemonitor
    entitlements:
      path: App/DeviceMonitor/SleepBankDeviceMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.doctordurant.sleepbank

schemes:
  SleepBank:
    build:
      targets:
        SleepBank: all
    run:
      config: Debug
  SleepBankWatch:
    build:
      targets:
        SleepBankWatch: all
    run:
      config: Debug
